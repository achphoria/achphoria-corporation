# Konfigurasi minimal Supabase CLI untuk repo ini (hanya dipakai saat deploy Edge Function).
# Project: ckoejqzownrujikefgwb (selalu deploy dengan --project-ref ckoejqzownrujikefgwb).
project_id = "achphoria-corporation"

[functions.ach-bridge]
