<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ACHPHORIA CORPORATION · Kantor Virtual</title>
  <meta name="description" content="Kantor virtual LIVE ACHPHORIA CORPORATION — kantor bergaya Jepang tempat 5 agen AI bekerja, rapat di kotatsu, dan makan ramen." />
  <meta name="theme-color" content="#2e3a63" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar" class="topbar">
    <div id="logo" class="brand" aria-label="ACHPHORIA CORPORATION">
      <div class="hanko" title="達成 — pencapaian" aria-hidden="true"><span>達</span><span>成</span></div>
      <div class="wm">
        <h1>ACHPHORIA</h1>
        <div class="wm-sub"><span>CORPORATION</span></div>
      </div>
    </div>
    <div id="sumBar" class="sumbar" aria-live="polite"></div>
    <div id="hud" class="hud">
      <div class="clockbox">
        <div class="clock"><span id="clock">--.--</span><span id="sec" class="sec2">--</span><small>WIB</small></div>
        <div id="date" class="date">—</div>
      </div>
      <button id="badge" class="badge demo" title=""><i></i>DEMO</button>
    </div>
  </header>

  <main id="stage" class="stage">
    <canvas id="scene" aria-label="Kantor ACHPHORIA bergaya Jepang"></canvas>
    <nav id="toolbar" class="dock" aria-label="Kontrol">
      <button data-act="board" title="Papan Tugas (T)"><b>📋</b><span class="lbl">Papan Tugas</span><kbd>T</kbd></button>
      <button data-act="log" title="Log aktivitas (L)"><b>📜</b><span class="lbl">Log</span><kbd>L</kbd></button>
      <button data-act="roster" title="Tim (K)"><b>👥</b><span class="lbl">Tim</span><kbd>K</kbd></button>
      <button data-act="home" title="Overview (0)"><b>🏠</b><span class="lbl">Overview</span><kbd>0</kbd></button>
    </nav>
    <div id="hint" class="hint">Klik maskot untuk ikuti · Scroll zoom · Seret geser · <kbd>Esc</kbd> kembali</div>
  </main>

  <aside id="sidebar" class="sidebar" aria-label="Dasbor">
    <button id="sheetHandle" class="sheet-handle" aria-label="Buka/tutup dasbor"><i></i></button>
    <div id="sumBarM" class="sumbar sumbar-m"></div>
    <section class="sb-sec">
      <div class="sb-h"><h2>Tim</h2><small id="teamMeta"></small></div>
      <div id="agentCards" class="acards"></div>
    </section>
    <section class="sb-sec">
      <div class="sb-h"><h2>Ringkasan hari ini</h2><small id="sumDate"></small></div>
      <div id="todaySum" class="today"></div>
    </section>
    <section class="sb-sec sb-feed">
      <div class="sb-h"><h2>Log langsung <span class="live-dot"></span></h2><button class="link" id="feedAll">Semua <kbd>L</kbd></button></div>
      <div id="feed" class="feed"></div>
    </section>
  </aside>

  <aside id="roster" class="panel washi side-left" hidden>
    <div class="ph"><h2>Tim ACHPHORIA</h2><button class="x" data-close="roster" aria-label="Tutup">✕</button></div>
    <div id="rosterList" class="plist"></div>
  </aside>

  <aside id="logPanel" class="panel washi side-right" hidden>
    <div class="ph"><h2>Log Aktivitas <span class="live-dot"></span></h2><button class="x" data-close="log" aria-label="Tutup">✕</button></div>
    <div id="logList" class="plist"></div>
  </aside>

  <section id="board" class="panel washi bottom" hidden>
    <div class="ph"><h2>Papan Tugas <small id="boardCount"></small></h2><button class="x" data-close="board" aria-label="Tutup">✕</button></div>
    <div class="cols" id="boardCols"></div>
  </section>

  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="loading" class="loading"><div class="hanko big"><span>達</span><span>成</span></div><p>Menyiapkan kantor…</p></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/util.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
